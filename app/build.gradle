plugins {
    id 'com.android.application' version '8.12.3'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

def releaseSigning = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].collectEntries { name ->
    [(name): providers.environmentVariable("TYPEANDFRAME_${name}").orNull]
}
def hasReleaseSigning = releaseSigning.values().every { it?.trim() }

android {
    namespace 'app.typeandframe.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'app.typeandframe.studio'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigning.KEYSTORE)
                storePassword releaseSigning.STORE_PASSWORD
                keyAlias releaseSigning.KEY_ALIAS
                keyPassword releaseSigning.KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'io.github.goooler.gpuimage:gpuimage:2.2.1'
}


kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
